[package]
name = "stellaryn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first Soroban contract compatibility analyzer"
default-run = "stellaryn"

[[bin]]
name = "stellaryn"
path = "src/main.rs"

[dependencies]
clap.workspace = true
stellaryn-core.workspace = true
stellaryn-wasm.workspace = true
stellaryn-diff.workspace = true
stellaryn-report.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
stellar-xdr.workspace = true
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "cli"
path = "../../tests/cli/help.rs"

[[test]]
name = "compare"
path = "../../tests/cli/compare.rs"
